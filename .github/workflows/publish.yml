# Publish @neptune810/dsh-model-router with npm Trusted Publishing (OIDC).
#
# One-time setup on npmjs.com — the package -> Settings -> Trusted Publishing:
#   Provider             GitHub Actions
#   Organization or user Neptune810
#   Repository           dsh-model-router
#   Workflow filename    publish.yml
#   Environment name     (leave empty)
#   Allowed actions      npm publish
#
# After that, pushing a vX.Y.Z tag publishes that version with a provenance
# attestation — no token on disk, no 2FA prompt.
#
# Shape:
#   test     Node 20/22/24 matrix, every test file, the release gate and the
#            generated catalog check. Runs on every push and pull request.
#   publish  Only on a v* tag, only after the whole matrix is green. The release
#            gate re-checks that the tag, package.json and CHANGELOG agree and
#            that the tarball ships what the "files" whitelist promises.

name: publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read
  id-token: write # the OIDC token npm exchanges for a short-lived publish credential

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"

      - name: Syntax check
        run: |
          set -eu
          for f in lib/*.js client/client.js scripts/*.mjs; do
            node --check "$f"
          done

      # Keep the published artifact gated on the whole suite, but make a failure
      # readable: raw Actions logs need admin rights, while check-run
      # annotations are public. On failure each broken file is re-run alone and
      # its tail lands in an annotation, so a red run can be diagnosed from the
      # public API without re-running anything.
      - name: Test
        run: |
          set -u
          if npm test > /tmp/test.log 2>&1; then
            cat /tmp/test.log
            exit 0
          fi
          echo "npm test failed; full log follows"
          tail -120 /tmp/test.log
          annotated=0
          for f in test/*.test.js; do
            if node --test "$f" > /tmp/one.log 2>&1; then continue; fi
            msg="$(tail -80 /tmp/one.log | tr '\n' ' ' | tr -s ' ' | cut -c1-3800)"
            echo "::error file=$f::TEST FAILED in $f :: $msg"
            annotated=$((annotated + 1))
          done
          if [ "$annotated" -eq 0 ]; then
            msg="$(grep -E '✖|AssertionError|expected|actual|Error:' /tmp/test.log | head -20 | tr '\n' ' ' | cut -c1-3800)"
            echo "::error::npm test failed while every test file passed alone :: $msg"
          fi
          exit 1

      - name: Release gate (tag, version, CHANGELOG, tarball contents; node 24)
        if: matrix.node == '24'
        run: node scripts/check-release.mjs --pack

      - name: Catalog is generated from catalog/model-catalog.yaml (node 24)
        if: matrix.node == '24'
        run: |
          set -eu
          python3 -m pip install --quiet pyyaml
          python3 scripts/build-catalog.py --check

      - name: Catalog validator (node 24)
        if: matrix.node == '24'
        run: node scripts/check-catalog.mjs

  publish:
    name: publish
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm 11, the first line able to exchange the GitHub OIDC
      # token for a publish credential (trusted publishing needs npm >= 11.5.1).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Release gate
        run: node scripts/check-release.mjs --pack

      # No registry-url and no NODE_AUTH_TOKEN on purpose: with id-token: write,
      # npm finds the OIDC identity by itself.
      #
      # npm >= 11 holds a fresh publish in a *staging* window (minutes, and it
      # has been seen at 17) before the version is visible on the registry.
      # Publishing again during that window fails with
      # "E409 ... Cannot publish over previously staged version" even though the
      # first upload was accepted, so that exact conflict is not a failure.
      - name: Publish
        run: |
          set -u
          version="$(node -p "require('./package.json').version")"
          if ! out="$(npm publish --access public 2>&1)"; then
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -qiE 'E409|previously staged|Cannot publish over'; then
              echo "::warning::npm kept $version in its staging window; the publish was accepted and becomes visible shortly."
              exit 0
            fi
            exit 1
          fi
          printf '%s\n' "$out"
